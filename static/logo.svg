<svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
    <title>Genetic Algorithm Logo</title>
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#50E3C2;stop-opacity:1" />
        </linearGradient>
    </defs>
    <g transform="translate(100, 100) scale(0.9)">
        <!-- Strand 1 -->
        <path d="M -60,-80 Q 0,-80 0,0 T 60,80" stroke="url(#grad1)" stroke-width="10" fill="none" stroke-linecap="round"/>
        <!-- Strand 2 -->
        <path d="M 60,-80 Q 0,-80 0,0 T -60,80" stroke="url(#grad1)" stroke-width="10" fill="none" stroke-linecap="round"/>
        <!-- Connecting Bars -->
        <line x1="-40" y1="-40" x2="40" y2="-40" stroke="#B0B0B0" stroke-width="5" stroke-linecap="round"/>
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#B0B0B0" stroke-width="5" stroke-linecap="round"/>
        <line x1="-40" y1="40" x2="40" y2="40" stroke="#B0B0B0" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Text -->
    <text x="50%" y="205" font-family="monospace, sans-serif" font-size="16" text-anchor="middle" fill="#333">
        Genetic Algorithm
    </text>
</svg>